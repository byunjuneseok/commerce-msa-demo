plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

allprojects {
    group = 'binaryflavor'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    group = 'binaryflavor'
    version = '0.0.1-SNAPSHOT'

    dependencies {
    }
}

tasks.getByName("bootJar") {
    enabled = false
}

tasks.getByName("jar") {
    enabled = true
}