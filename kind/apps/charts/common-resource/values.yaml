gateway:
  name: my-gateway
  namespace: istio-system

  hosts:
    - "*"

  port:
    number: 443
    name: https
    protocol: HTTPS

  tls:
    mode: MUTUAL
    serverCertificate: /etc/istio/ingressgateway-certs/tls.crt
    privateKey: /etc/istio/ingressgateway-certs/tls.key
    caCertificates: /etc/istio/ca-cert/ca.crt
