apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: commerce-msa
spec:
  generators:
    - git:
        repoURL: https://github.com/byunjuneseok/commerce-msa-demo.git
        revision: develop
        files:
          - path: "kind/apps/configs/**/config.json"
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/byunjuneseok/commerce-msa-demo.git
        targetRevision: develop
        path: kind/apps/charts/app
        helm:
          valueFiles:
            - '../../values/{{name}}/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
