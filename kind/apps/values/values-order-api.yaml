replicaCount: 1

image:
  repository: ghcr.io/byunjuneseok/commerce-msa-demo-order-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

service:
  type: LoadBalancer
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: order-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - hosts:
  #       - order-api.local
  #     secretName: order-api-tls 
  