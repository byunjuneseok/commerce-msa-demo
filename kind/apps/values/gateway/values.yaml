replicaCount: 1

image:
  repository: ghcr.io/byunjuneseok/commerce-msa-demo-gateway
  tag: 25.04.14-develop.1950-9c3b142
  pullPolicy: IfNotPresent

env:
  - name: spring_cloud_gateway_order_api_uri
    value: http://order-api-app.default.svc.cluster.local:8080
  - name: spring_cloud_gateway_inventory_api_uri
    value: http://order-api-app.default.svc.cluster.local:8080

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: api.binaryflavor.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
