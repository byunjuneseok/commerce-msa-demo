replicaCount: 1

image:
  repository: ghcr.io/byunjuneseok/commerce-msa-demo-order-api
  tag: 25.04.13-develop.2207-aef4b09
  pullPolicy: IfNotPresent

env:
  - name: mysql_datasource_hikari_jdbc_url
    value: jdbc:mysql://mysql-order-api-mysql:3306/order
  - name: mysql_datasource_hikari_username
    value: order
  - name: mysql_datasource_hikari_password
    value: password

imagePullSecrets:
  - name: ghcr-secret

service:
  type: LoadBalancer
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: order-api.binaryflavor.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - hosts:
  #       - order-api.local
  #     secretName: order-api-tls 
  