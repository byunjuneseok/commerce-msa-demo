name: Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'gateway/**'
      - 'inventory-api/**'
      - 'order-api/**'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        app: [
          'order-api',
          'inventory-api',
        ]
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag_matrix: ${{ steps.set-matrix.outputs.result }}

    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: bash version.bash

      - name: SetUp to Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: .github/buildkitd.toml
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@v6
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}-${{ matrix.app }}
          IMAGE_TAG: '${{ steps.version.outputs.semVer }}-${{ steps.version.outputs.shortSha }}'
        with:
          file: Dockerfile
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_NAME=${{ matrix.app }}
