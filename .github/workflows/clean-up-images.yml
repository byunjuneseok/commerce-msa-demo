name: Delete Old Packages

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [
        'order-api',
      ] }
    steps:
    - uses: actions/delete-package-versions@v5
      env:
        IMAGE_NAME: ${{ github.repository }}-${{ matrix.app }}
      with:
        package-name: ${{ env.IMAGE_NAME }}
        package-type: container
        min-versions-to-keep: 3
